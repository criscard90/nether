<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GIF Loop</title>
  <style>
    /* Reset totale di margini e blocco dello scroll */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      display: flex;
      flex-direction: column; /* Impila la banda nera e la GIF in verticale */
    }

    /* Banda nera in alto (10% dell'altezza dello schermo) */
    .spacer {
      width: 100%;
      height: 10vh;
      background-color: #000;
    }

    /* La GIF occupa il restante 90% dell'altezza dello schermo */
    img.gif-loop {
      width: 100vw;
      height: 90vh;
      /* 'cover' riempie tutto lo spazio senza deformare l'immagine */
      /* Se preferisci vedere l'immagine intera senza ritagli, usa 'contain' */
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Spazio per la banda nera in alto -->
  <div class="spacer"></div>

  <!-- La tua GIF (assicurati che il nome del file corrisponda a quello su GitHub) -->
  <img src="loop.gif" class="gif-loop" alt="GIF Loop">

</body>
</html>
